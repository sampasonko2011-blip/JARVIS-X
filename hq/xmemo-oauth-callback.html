<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#090d18">
<title>JARVIS-X HQ · XMemo connection</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif;background:#090d18;color:#eef3ff}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{max-width:560px;width:100%;padding:28px;border:1px solid #29354d;border-radius:18px;background:#111a2b}
h1{font-size:1.4rem;margin:0 0 12px}p{color:#bdc9dc}#status{padding:12px;border-radius:10px;background:#18243a}
</style>
</head>
<body>
<main>
<h1>JARVIS-X HQ · XMemo authorization</h1>
<p id="status" role="status" aria-live="polite">Completing the secure connection…</p>
<p>You can close this tab after a successful connection. OAuth tokens are sent directly to the authenticated gateway and are never stored in this page or its URL.</p><p><a href="./index.html">Return to JARVIS-X HQ</a></p>
</main>
<script>
(async()=>{
 const status=document.getElementById("status");
 const params=new URLSearchParams(location.search);
 const code=params.get("code"),state=params.get("state"),providerError=params.get("error");
 history.replaceState(null,"",location.pathname);
 const fail=(message)=>{status.textContent=message;};
 if(providerError){fail("XMemo authorization was not completed: "+providerError);return;}
 if(!code||!state){fail("Authorization response is incomplete. Return to HQ and start again.");return;}
 let session=null;
 try{session=JSON.parse(sessionStorage.getItem("jx-auth-session")||"null");}catch{}
 if(!session||typeof session.access_token!=="string"||typeof session.refresh_token!=="string"){
   fail("Your HQ sign-in session is unavailable in this browser tab. Return to the same HQ tab and start again.");return;
 }
 const projectUrl="https://xfewajxkqntflfntisut.supabase.co";
 const publishableKey="sb_publishable_QBs3Y2uByK2kSWXCPg54CQ_oEYapzLg";
 try{
   if(Number(session.expires_at)<=Math.floor(Date.now()/1000)+60){
     const refresh=await fetch(projectUrl+"/auth/v1/token?grant_type=refresh_token",{
       method:"POST",headers:{apikey:publishableKey,"Content-Type":"application/json"},
       body:JSON.stringify({refresh_token:session.refresh_token}),cache:"no-store",redirect:"error"
     });
     if(!refresh.ok)throw new Error("Your HQ sign-in expired. Sign in again and restart XMemo connection.");
     const renewed=await refresh.json();
     if(typeof renewed.access_token!=="string"||typeof renewed.refresh_token!=="string")throw new Error("The HQ session refresh response was invalid.");
     session={access_token:renewed.access_token,refresh_token:renewed.refresh_token,expires_at:Number(renewed.expires_at)||Math.floor(Date.now()/1000)+Number(renewed.expires_in||3600)};
     sessionStorage.setItem("jx-auth-session",JSON.stringify(session));
   }
   const response=await fetch(projectUrl+"/functions/v1/hq-gateway-v12/auth/xmemo/callback",{
     method:"POST",
     headers:{apikey:publishableKey,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json",Accept:"application/json"},
     body:JSON.stringify({code,state}),cache:"no-store",redirect:"error"
   });
   const result=await response.json().catch(()=>({}));
   if(!response.ok)throw new Error(typeof result.error==="string"?result.error:"Gateway returned HTTP "+response.status);
   if(result.connected!==true)throw new Error("The gateway did not confirm the XMemo connection.");
   fail("XMemo is connected to this authenticated HQ account. Tokens remain encrypted on the server.");
 }catch(error){fail("Connection failed: "+String(error.message||error)+". Return to HQ and retry after checking your sign-in.");}
})();
</script>
</body>
</html>
