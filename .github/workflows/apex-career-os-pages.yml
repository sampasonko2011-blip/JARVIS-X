name: Deploy Apex Career OS to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apex-career-os/**"
      - ".github/workflows/apex-career-os-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apex-career-os-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static app
        run: |
          mkdir -p _site
          cp apex-career-os/index.html _site/index.html
          cp apex-career-os/README.md _site/README.md
          cp -R apex-career-os/performance-archive _site/performance-archive
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
