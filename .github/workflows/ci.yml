name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run benchmark
      - name: Runtime comparison benchmark
        run: npm run benchmark:runtime
        env:
          JX_BENCH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload runtime benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-x-runtime-benchmark-${{ github.event.pull_request.head.sha || github.sha }}
          path: benchmark-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Orbit live smoke
        if: ${{ vars.ORBIT_LIVE_TEST_ENABLED == 'true' }}
        env:
          ORBIT_BASE_URL: ${{ secrets.ORBIT_BASE_URL }}
          ORBIT_API_KEY: ${{ secrets.ORBIT_API_KEY }}
        run: |
          set -euo pipefail

          test -n "$ORBIT_BASE_URL"
          test -n "$ORBIT_API_KEY"

          MODELS_JSON="$(curl -fsS --max-time 30 \
            -H "Authorization: Bearer $ORBIT_API_KEY" \
            "$ORBIT_BASE_URL/models")"

          MODEL="$(printf '%s' "$MODELS_JSON" | node -e '
            let s="";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              const j = JSON.parse(s);
              const ids = (j.data || []).map(x => x.id).filter(id => typeof id === "string");
              const preferred = [/haiku/i, /flash/i, /mini/i, /small/i];
              const model = ids.find(id => preferred.some(re => re.test(id)));
              if (!model) {
                console.error("No explicitly low-cost model found; refusing to guess.");
                process.exit(2);
              }
              process.stdout.write(model);
            });
          ')"

          echo "Orbit model selected: $MODEL"

          RESPONSE="$(curl -fsS --max-time 60 \
            -H "Authorization: Bearer $ORBIT_API_KEY" \
            -H "Content-Type: application/json" \
            "$ORBIT_BASE_URL/chat/completions" \
            -d "$(node -e '
              console.log(JSON.stringify({
                model: process.argv[1],
                messages: [
                  {
                    role: "user",
                    content: "Reply with exactly ORBIT_LIVE_OK and nothing else."
                  }
                ],
                temperature: 0,
                max_tokens: 8
              }))
            ' "$MODEL")")"

          printf '%s\n' "$RESPONSE" | node -e '
            let s="";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              const j = JSON.parse(s);
              const text = j.choices?.[0]?.message?.content;
              if (text !== "ORBIT_LIVE_OK") {
                console.error("Unexpected Orbit response:", text);
                process.exit(1);
              }
              console.log("Orbit live smoke passed.");
            });
          '
