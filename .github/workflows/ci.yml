name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Validate evaluator syntax
        run: node --check scripts/orbit-evaluate.mjs
      - name: Validate model scout syntax
        run: node --check scripts/model-scout.mjs
      - run: npm run benchmark
      - name: Runtime comparison benchmark
        run: npm run benchmark:runtime
        env:
          JX_BENCH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload runtime benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-x-runtime-benchmark-${{ github.event.pull_request.head.sha || github.sha }}
          path: benchmark-results.json
          if-no-files-found: warn
          retention-days: 14
