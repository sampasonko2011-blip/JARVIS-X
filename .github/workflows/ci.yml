name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run benchmark
      - name: Orbit live smoke
        env:
          ORBIT_BASE_URL: ${{ secrets.ORBIT_BASE_URL }}
          ORBIT_API_KEY: ${{ secrets.ORBIT_API_KEY }}
        run: |
          set -euo pipefail

          test -n "$ORBIT_BASE_URL"
          test -n "$ORBIT_API_KEY"

          MODELS_JSON="$(curl -fsS --retry 2 --max-time 30 \
            -H "Authorization: Bearer $ORBIT_API_KEY" \
            "$ORBIT_BASE_URL/models")"

          MODEL="$(printf '%s' "$MODELS_JSON" | node -e '
            let s="";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              const j = JSON.parse(s);
              const ids = (j.data || []).map(x => x.id);

              const preferred = [
                /claude.*opus/i,
                /gpt-5/i,
                /claude.*sonnet/i
              ];

              let model = ids.find(id =>
                preferred.some(re => re.test(id))
              );

              if (!model) model = ids[0];
              if (!model) process.exit(2);

              process.stdout.write(model);
            });
          ')"

          echo "Orbit model selected: $MODEL"

          RESPONSE="$(curl -fsS --retry 2 --max-time 60 \
            -H "Authorization: Bearer $ORBIT_API_KEY" \
            -H "Content-Type: application/json" \
            "$ORBIT_BASE_URL/chat/completions" \
            -d "$(node -e '
              console.log(JSON.stringify({
                model: process.argv[1],
                messages: [
                  {
                    role: "user",
                    content: "Reply with exactly ORBIT_LIVE_OK and nothing else."
                  }
                ],
                temperature: 0,
                max_tokens: 20
              }))
            ' "$MODEL")")"

          printf '%s\n' "$RESPONSE" | node -e '
            let s="";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              const j = JSON.parse(s);
              const text = j.choices?.[0]?.message?.content?.trim();

              if (text !== "ORBIT_LIVE_OK") {
                console.error("Unexpected Orbit response:", text);
                process.exit(1);
              }

              console.log(
                "ORBIT_LIVE_OK model=" + (j.model || "unknown")
              );
            });
          '
