name: CI

on:
  push:
    branches: [main, 'feature/**', 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the versioned Supabase gateway
        run: deno check supabase/functions/hq-gateway-v12/index.ts
      # Keep the isolated memory endpoint type-checked independently of inference.
      - name: Type-check the isolated memory gateway
        run: deno check supabase/functions/hq-memory-v1/index.ts
      - name: Type-check the PRONOTE iPad bridge
        run: deno check supabase/functions/pronote-ipad-bridge/index.ts
      - name: Type-check the AI Builder approval gateway
        run: deno check supabase/functions/ai-builder-approval/index.ts
      - run: npm test
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run HQ browser end-to-end tests
        run: npm run test:e2e
      - name: Validate evaluator syntax
        run: node --check scripts/orbit-evaluate.mjs
      - name: Validate Mission Control script syntax
        run: node --check hq/mission-control.js
      - name: Validate provider smoke-test script syntax
        run: node --check scripts/provider-smoke.mjs
      - name: Validate HQ service worker syntax
        run: node --check hq/sw.js
      - name: Validate Observatory v32 scripts
        run: |
          node --check hq/observatory.js
          node --check hq/observatory-v31.js
          node --check hq/observatory-v32.js
          node --check hq/interstellar-v30.js
      - name: Validate local runtime preflight syntax
        run: node --check hq/local-chat-preflight.js
      - name: Validate HQ chat client syntax
        run: node --check hq/hq.js
      - run: npm run benchmark
      - name: Runtime comparison benchmark
        run: npm run benchmark:runtime
        env:
          JX_BENCH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload runtime benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-x-runtime-benchmark-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            benchmark-results.json
            hq/local-chat-engine.bundle.js
          if-no-files-found: warn
          retention-days: 14
  sync-bundle:
    needs: verify
    if: github.ref == 'refs/heads/feat/p0-security-reconciliation-spatial-hud'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-x-runtime-benchmark-${{ github.sha }}
          path: generated
      - name: Commit generated bundle to this feature branch only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp generated/hq/local-chat-engine.bundle.js hq/local-chat-engine.bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hq/local-chat-engine.bundle.js
          if ! git diff --cached --quiet; then
            git commit -m "build(local-chat): sync consent-hardened bundle [skip ci]"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
