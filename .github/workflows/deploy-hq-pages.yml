name: Deploy JARVIS-X and Apex Career OS

on:
  push:
    branches: [main]
    paths:
      - "hq/**"
      - "apex-career-os/**"
      - ".github/workflows/deploy-hq-pages.yml"
      - ".github/workflows/apex-career-os-deploy.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jarvis-x-hq-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build HQ local runtime bundle
        run: npm install && npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build combined site artifact
        run: |
          mkdir -p _site/career _site/hq
          # JARVIS-X is the primary site entry point. Keep the football mission
          # workspace available separately so it cannot replace the HQ homepage.
          cp -R hq/. _site/
          cp apex-career-os/index.html _site/career/index.html
          cp apex-career-os/README.md _site/career/README.md
          if [ -d apex-career-os/performance-archive ]; then cp -R apex-career-os/performance-archive _site/career/performance-archive; fi
          # Retain the explicit /hq/ path as a stable alias for existing bookmarks.
          mkdir -p _site/hq
          cp -R hq/. _site/hq/
      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy combined site
        id: deployment
        uses: actions/deploy-pages@v4
