name: Deploy JARVIS-X and Apex Career OS

on:
  push:
    branches: [main]
    paths:
      - "hq/**"
      - "apex-career-os/**"
      - ".github/workflows/deploy-hq-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jarvis-x-hq-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build combined site artifact
        run: |
          mkdir -p _site/hq
          cp apex-career-os/index.html _site/index.html
          cp apex-career-os/README.md _site/README.md
          if [ -d apex-career-os/performance-archive ]; then cp -R apex-career-os/performance-archive _site/performance-archive; fi
          cp -R hq/. _site/hq/
      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy combined site
        id: deployment
        uses: actions/deploy-pages@v4
