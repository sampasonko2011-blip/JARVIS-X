name: Deploy JARVIS-X HQ to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "hq/**"
      - ".github/workflows/deploy-hq-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jarvis-x-hq-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload HQ static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: hq
      - name: Deploy HQ
        id: deployment
        uses: actions/deploy-pages@v4
