name: Exocortex Swift Core and Native Llama
on:
  pull_request:
    paths: ['Package.swift', 'README.md', 'docs/exocortex-validation.md', 'docs/p3-agent-factory-pronote-ipad-bridge.md', 'docs/ai-builder-sandbox-l3.md', 'docs/pronote-ipad-real-setup.md', 'src/core/agent-factory.ts', 'src/core/ai-builder.mjs', 'src/core/pronote-bridge-contract.mjs', 'src/forge/tool-sandbox-runner.mjs', 'supabase/functions/pronote-ipad-bridge/**', 'supabase/functions/ai-builder-approval/**', 'supabase/migrations/*pronote_ipad_bridge.sql', 'exocortex/**', '.github/workflows/exocortex-swift.yml']
  push:
    branches: [main, 'feat/**', 'feature/**']
    paths: ['Package.swift', 'docs/p3-agent-factory-pronote-ipad-bridge.md', 'docs/ai-builder-sandbox-l3.md', 'docs/pronote-ipad-real-setup.md', 'src/core/agent-factory.ts', 'src/core/ai-builder.mjs', 'src/core/pronote-bridge-contract.mjs', 'src/forge/tool-sandbox-runner.mjs', 'supabase/functions/pronote-ipad-bridge/**', 'supabase/functions/ai-builder-approval/**', 'supabase/migrations/*pronote_ipad_bridge.sql', 'exocortex/**', '.github/workflows/exocortex-swift.yml']
permissions:
  contents: read
jobs:
  swift-core-and-ios-simulator:
    runs-on: macos-15
    defaults:
      run:
        working-directory: exocortex
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and runner identity
        run: |
          swift --version
          xcodebuild -version
          echo "runner_arch=$(uname -m)"
          system_profiler SPHardwareDataType | grep -E 'Chip|Processor Name|Memory' || true
      - name: Root Swift package manifest — iPad import entry point
        working-directory: .
        run: swift build --target ExocortexDeviceProbe -c release -Xswiftc -warnings-as-errors
      - name: Portable core tests
        run: swift test --filter ExocortexCoreTests -Xswiftc -warnings-as-errors
      - name: Portable core release build
        run: swift build --target ExocortexCore -c release -Xswiftc -warnings-as-errors
      - name: Device probe portable module build
        run: swift build --target ExocortexDeviceProbe -c release -Xswiftc -warnings-as-errors
      - name: iOS Simulator build — portable core only
        run: xcodebuild -scheme ExocortexCore -destination 'generic/platform=iOS Simulator' build
  swift-native-llama-macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: exocortex
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and runner identity
        run: |
          swift --version
          xcodebuild -version
          echo "runner_arch=$(uname -m)"
          system_profiler SPHardwareDataType | grep -E 'Chip|Processor Name|Memory' || true
      - name: Resolve pinned llama.swift 3.0.0
        run: swift package resolve
      - name: Native llama product build
        run: swift build --target ExocortexLlamaNative -c release -Xswiftc -warnings-as-errors
      - name: Native llama deterministic lifecycle tests
        run: swift test --filter NativeLlamaBackendTests -Xswiftc -warnings-as-errors
