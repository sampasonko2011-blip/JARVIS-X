name: Apex Career OS — Pages

on:
  push:
    branches: [main]
    paths:
      - "apex-career-os/**"
      - ".github/workflows/apex-career-os-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apex-career-os-pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate application source
        run: |
          sed -n '/<script>/,/<\/script>/p' apex-career-os/index.html | sed '1d;$d' > /tmp/apex.js
          node --check /tmp/apex.js
          node apex-career-os/tests/check-source.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apex-career-os
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
