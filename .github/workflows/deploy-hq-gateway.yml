name: Deploy JARVIS-X HQ Gateway

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/hq-gateway-v12/**"
      - ".github/workflows/deploy-hq-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-x-hq-gateway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy authenticated HQ gateway when the deployment token is configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not configured; gateway deployment was skipped."
            exit 0
          fi
          supabase functions deploy hq-gateway-v12 --project-ref xfewajxkqntflfntisut --no-verify-jwt
